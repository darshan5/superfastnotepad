[package]
name = "superfastnotepad"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A fast text editor written in pure Rust (Windows + macOS)"

[[bin]]
name = "superfastnotepad"
path = "src/main.rs"

[dependencies]
# `clipboard` connects copy and paste to the system clipboard.
eframe = { version = "0.37", default-features = false, features = ["glow", "clipboard"] }
egui = "0.37"
ropey = { version = "1.6", default-features = false, features = ["simd", "cr_lines"] }
encoding_rs = "0.8"
fancy-regex = "0.20"
regex = "1"
rfd = "0.17"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
directories = "6"
chrono = "0.4"
unicode-width = "0.2"
walkdir = "2"
similar = { version = "3", features = ["unicode"] }
arboard = { version = "3", default-features = false }
# OS secure random numbers for the password generator.
getrandom = "0.4"

# Receiving files opened from Finder (same version the window library uses).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Callback for the system color sampler (eyedropper).
block2 = "0.6"

# Eyedropper: pointer position, key state and screen pixels.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
